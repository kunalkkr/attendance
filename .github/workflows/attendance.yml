name: Hajiri Break, Back & Out Automation

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to trigger manually or via API'
        required: true
        default: '/break'
        type: choice
        options:
          - '/break'
          - '/back'
          - '/out'

jobs:
  attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Attendance Command
        env:
          HAJIRI_EMAIL: ${{ secrets.HAJIRI_EMAIL }}
          HAJIRI_PASSWORD: ${{ secrets.HAJIRI_PASSWORD }}
          HAJIRI_USER_UUID: "07f83471-7031-11ef-be8b-0214d21f7cf7"
          COMMAND: ${{ github.event.inputs.command }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import requests
          from urllib.parse import urlparse, parse_qs

          email = os.environ["HAJIRI_EMAIL"]
          password = os.environ["HAJIRI_PASSWORD"]
          user_uuid = os.environ.get("HAJIRI_USER_UUID", "07f83471-7031-11ef-be8b-0214d21f7cf7")
          command = os.environ.get("COMMAND", "").strip()

          if not command:
              print("Error: No command provided!")
              sys.exit(1)

          print(f"=== Starting Routine: {command} ===")

          # Step 1: Authenticate
          login_url = "https://production.hajiri.work/api/v2/user/auth/login/email"
          login_resp = requests.get(
              login_url,
              params={"email": email, "password": password},
              headers={"Accept": "application/json"},
              timeout=20
          )
          login_resp.raise_for_status()
          login_data = login_resp.json()

          if not login_data.get("status"):
              print("Authentication failed:", login_data)
              sys.exit(1)

          token = login_data.get("tokenResponse", {}).get("access_token")
          if not token:
              print("Token missing from response:", login_data)
              sys.exit(1)

          user_uuid = login_data.get("userUuid") or user_uuid
          print(f"Authenticated successfully. Using userUuid: {user_uuid}")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          # Step 2: Trigger Dashboard Action
          attendance_url = "https://production.hajiri.work/api/v2/attendance/checkin-checkout-from-dashboard"
          att_resp = requests.post(
              attendance_url,
              params={"user_uuid": user_uuid, "command": command},
              headers=headers,
              timeout=20
          )
          print(f"Initial Command HTTP Status: {att_resp.status_code}")
          att_data = att_resp.json()
          print("Response Data:", att_data)

          # Step 3: Handle /out Location Validation Pipeline
          if command == "/out":
              msg_url = att_data.get("message", "")
              unique_id = None

              # Extract uniqueId from redirect URL query parameters
              if msg_url and "uniqueId=" in msg_url:
                  parsed = urlparse(msg_url)
                  qs = parse_qs(parsed.query)
                  unique_id = qs.get("uniqueId", [None])[0]

              if not unique_id:
                  print("Error: Could not extract uniqueId from message URL:", msg_url)
                  sys.exit(1)

              print(f"Extracted uniqueId: {unique_id}")

              # Optional verification ping if required by Hajiri
              validator_url = "https://production.hajiri.work/api/v2/user/auth/location-validator-url"
              try:
                  val_resp = requests.get(
                      validator_url,
                      params={"uniqueId": unique_id},
                      headers=headers,
                      timeout=20
                  )
                  print(f"Validator URL Ping HTTP Status: {val_resp.status_code}")
              except Exception as e:
                  print(f"Warning: Validator ping failed or skipped: {e}")

              # Submit location verification payload
              location_submit_url = "https://production.hajiri.work/api/v2/attendance/check-in-location"
              payload = {
                  "id": 0,
                  "latitude": "28.391356375316565",
                  "longitude": "77.05989980541284",
                  "distance": "",
                  "status": "",
                  "addressLine1": "",
                  "currentLocation": "93R6+G3C, Sector 67, Gurugram, Haryana 122101, India",
                  "imageUrl": "",
                  "locationName": "",
                  "uniqueId": unique_id
              }

              loc_resp = requests.post(
                  location_submit_url,
                  params={"userUuid": user_uuid},
                  json=payload,
                  headers=headers,
                  timeout=20
              )
              print(f"Check-In-Location HTTP Status: {loc_resp.status_code}")
              try:
                  print("Location Response:", loc_resp.json())
              except Exception:
                  print("Raw Location Response:", loc_resp.text)

              loc_resp.raise_for_status()

          att_resp.raise_for_status()
          print(f"=== Successfully executed {command} ===")
          EOF
